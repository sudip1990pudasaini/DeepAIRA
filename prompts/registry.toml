# Prompt registry: the single source of truth for every prompt used by DeepAIRA.
# Rules (enforced by tools/governance.py):
#  - one file per version at prompts/<id>/v<version>.md; approved versions are immutable
#  - sha256 / schema_sha256 must match the files (drafts: run `governance.py rehash-prompts`)
#  - status: draft -> candidate -> approved -> retired. "approved" needs tested_model + eval_run
#  - a prompt change means a new version and a new eval run (qa/eval-runs/)

